task_id: ocean_mesoscale_eddy_closure__Sx
domain: earth_science / ocean_dynamics
license: MIT

# Type I — single simulation; no cluster structure; all formula coefficients
# are global scalars (kappa, w0..w2); no per-cluster refit needed.
type: typeI
has_group_id: false

# Background knowledge — the `context` prompt slot. Science framing only:
# no task instructions, no column listing, no priors.
context: >-
  Ocean mesoscale eddies are rotating vortices that climate models cannot resolve, so their unresolved momentum effect must be represented through a subgrid closure, a problem in physical oceanography and geophysical fluid dynamics.

target:
  name: Sx
  symbol: S_x
  unit: m s^-2
  description: Zonal component of the subgrid-scale eddy momentum forcing diagnosed from coarse-graining a high-resolution quasi-geostrophic velocity field — the divergence of the Leonard/Reynolds stress tensor in the zonal direction.
  range: [-1.67125285e-07, 1.84873441e-07]

inputs:
  - name: u
    symbol: u
    unit: m s^-1
    description: Coarse-grained zonal velocity at the surface layer of the quasi-geostrophic simulation.
    range: [-7.96905228e-02, 7.38049104e-02]
  - name: v
    symbol: v
    unit: m s^-1
    description: Coarse-grained meridional velocity at the surface layer.
    range: [-7.46579791e-02, 8.79800756e-02]
  - name: zeta
    symbol: "ζ"
    unit: s^-1
    description: Relative vorticity of the coarse-grained flow, defined as the curl of the horizontal velocity.
    range: [-3.34078588e-06, 3.03244714e-06]
  - name: D
    symbol: D
    unit: s^-1
    description: Shearing deformation rate of the coarse-grained flow.
    range: [-2.12261552e-06, 2.08175902e-06]
  - name: Dtilde
    symbol: "D̃"
    unit: s^-1
    description: Stretching deformation rate of the coarse-grained flow.
    range: [-2.25952947e-06, 2.54185366e-06]
  - name: d_zeta2_dx
    symbol: "∂(ζ²)/∂x"
    unit: s^-2 m^-1
    description: Zonal spatial derivative of the squared relative vorticity (gradient of enstrophy).
    range: [-1.76202879e-16, 1.78375273e-16]
  - name: d_zetaD_dx
    symbol: "∂(ζD)/∂x"
    unit: s^-2 m^-1
    description: Zonal spatial derivative of the product of relative vorticity and shearing deformation.
    range: [-6.79301290e-17, 4.61087481e-17]
  - name: d_zetaDtilde_dy
    symbol: "∂(ζD̃)/∂y"
    unit: s^-2 m^-1
    description: Meridional spatial derivative of the product of relative vorticity and stretching deformation.
    range: [-7.16360334e-17, 6.76497490e-17]

# Dataset — Type I two-file layout
data_files:
  train: data/train.csv  # snapshots 0-52 post-spinup (temporal OOD split)
  test:  data/test.csv   # snapshots 53-66 post-spinup (later simulation states)

n_train: 54272
n_test:  14336

# Train/test split: Tier-3 temporal holdout — last 14 of 67 post-spinup
# snapshots form the test set. Rows are in (snapshot, y, x) order; cutoff
# at row 54272 = 53 × 1024. Tests extrapolation to later turbulent states.

# Audit note: all three baselines are linear in the same three derivative
# columns. The pyqg data are generated by a different simulator than the
# ZB2020 MITgcm run, so the frozen paper coefficients are a genuine OOD
# test; Ross 2023 §4 reports R^2 ≈ 0.3-0.5 for these formulas on this data.

# FM C12 (priors-leakage) fix — 2026-05-26
# All five original candidates (kappa_BT, kappa_BC, w0, w1, w2) were empirical
# RVM regression coefficients appearing verbatim in LAW_CONSTANTS. They are
# purely data-driven ML weights with no upstream physical anchor — Strategy B
# (remove). w4_zb2020 was already the sole distractor and stays; three more
# domain-relevant distractors added to reach the required 2-4 total.
priors:
  - name: w4_zb2020
    value: -6.332e8
    unit: m^2
    description: ZB2020 RVM weight for the meridional S_y component — the largest-magnitude weight in the full expansion; not used in the S_x formula benchmarked here.
    source: Zanna & Bolton 2020, PDF p. 6, Eq. (4) and surrounding text
    _role: distractor
  - name: beta_Coriolis
    value: 2.0e-11
    unit: m^-1 s^-1
    description: Meridional gradient of the Coriolis parameter at mid-latitudes (planetary beta-plane approximation). Relevant to geostrophic turbulence scaling but not a coefficient in the ZB2020/Ross eddy-stress closures.
    source: Standard oceanography reference value; Vallis 2006, Atmospheric and Oceanic Fluid Dynamics.
    _role: distractor
  - name: Rd_baroclinic
    value: 25000.0
    unit: m
    description: First baroclinic Rossby deformation radius — typical mid-latitude ocean value; sets the scale for baroclinic instability but is not a coefficient in the momentum-flux parameterizations used here.
    source: Standard oceanography reference; Chelton et al. 1998.
    _role: distractor
  - name: rho_seawater_ref
    value: 1025.0
    unit: kg m^-3
    description: Reference seawater density at surface conditions; used in density-normalized pressure formulations but not in the quasi-geostrophic eddy-stress closures.
    source: UNESCO/TEOS-10 standard reference density.
    _role: distractor

# Reference-baseline bank
references:
  - id: zanna_bolton_2020_eq5
    label: "Zanna & Bolton 2020 Eq. (5) — barotropic single-kappa closure (kappa_BT = -4.87e8 m^2)"
    formula_file: formulas/zanna_bolton_2020_eq5.py
    reference_pdf: reference/zanna_bolton_2020.pdf
    n_law_constants: 1    # kappa_BT
    n_other_constants: 0
    n_local_params: 0
    measured:
      r2: 0.283083
      rmse: 2.094457e-08
  - id: zanna_bolton_2020_eq4
    label: "Zanna & Bolton 2020 Eq. (4) — full 3-weight RVM barotropic (w0, w1, w2)"
    formula_file: formulas/zanna_bolton_2020_eq4.py
    reference_pdf: reference/zanna_bolton_2020.pdf
    n_law_constants: 3    # w0, w1, w2
    n_other_constants: 0
    n_local_params: 0
    measured:
      r2: 0.277229
      rmse: 2.102991e-08
  - id: ross_2023_zb_partial
    label: "Ross 2023 Eq. (A7) — ZB2020 baroclinic-shape partial closure (kappa_ZB2020 = -8.723e8 m^2)"
    formula_file: formulas/ross_2023_zb_partial.py
    reference_pdf: reference/ross_2023.pdf
    n_law_constants: 1    # kappa_ZB2020
    n_other_constants: 0
    n_local_params: 0
    measured:
      r2: 0.334932
      rmse: 2.017299e-08

caps:
  max_law_constants:       3
  max_local_params:        0
  max_init_size_per_param: 1
  fit_timeout_seconds:     null

# metric: r2 chosen over rmse because the physical units (m s^-2 ~ 10^-8) cause
# rmse to be far below the harness REF_EPS threshold (1e-4), making the rmse
# non-discriminative for scoring purposes. r2 is dimensionless and directly
# reflects the fraction of variance explained — the standard metric in ZB2020
# and Ross 2023 for comparing parameterizations.
metric: r2
# === Validity rubric ===
# Frozen list — the scoring-time judge (eval_consistency.py) scores a
# submission by how many of THESE criteria it satisfies:
# validity_score = (criteria satisfied) / len(validity_rubrics).
# De-leaked context + comprehensive multi-baseline extraction, 2026-06-01.
validity_rubrics:
  - "includes the meridional divergence of the vorticity–stretching-deformation stress contribution"
  - "includes the zonal divergence of the vorticity–shearing-deformation stress contribution"
  - "includes the zonal enstrophy-gradient contribution to eddy momentum forcing"
  - "represents inverse-cascade backscatter from unresolved eddies to the resolved flow"
  - "predicted Sx has units of acceleration, m s^-2"
  - "predicted Sx is invariant under adding a spatially uniform horizontal velocity to the resolved flow"
  - "predicted Sx integrates to zero over a periodic or closed domain"

best_baseline: 0.334932    # ross_2023_zb_partial — r2 (higher is better); regenerated 2026-05-30
