task_id: fluid_surface_tension_nist_webbook_eotvos__sigma
domain: materials_and_energy / physical_chemistry
license: NIST-PD

# Audit 2026-06-02 (Opus 4.8, 逐条审核): KEEP. The data is REFPROP/Mulero-correlation
# output (Mulero self-fits R²=1.000000 → dropped as tautology), but the scored Eötvös/Kaptay
# baseline is a genuinely distinct closed-form law (Kaptay 2024 Eq.2, PDF-verified) that fits
# only approximately (pooled R²=0.9951; methanol R²=0.90) → a real SR target, NOT circular.
# This is DISTINGUISHABLE from the discarded sister fluid_vapor_pressure_nist_webbook (whose
# Antoine baseline reached R²=0.99999689, ~1562× more saturated → FM-T9 layered tautology).
# Hygiene only: archived the unscored mulero_2012.py to .dropped_baselines/; corrected the
# Setting-1 note below. No data/formula/metric change. See VERDICT.md.

# Type II — cluster = substance (pure fluid). Each substance contributes
# ~190 rows spanning T in [T_triple, 0.85 * T_c]. The reference formula
# (Eötvös rule, Kaptay 2024) has 1 per-cluster LOCAL_FITTABLE parameter (k)
# that is refit per substance; the functional form sigma = k*(T_c-T)/V_m^(2/3)
# is universal across all substances.
type: typeII
has_group_id: true

# Setting 1 (real-data discovery) — NIST WebBook REFPROP output is the data anchor.
# Setting-1 marker = absence of an evaluation/rubric.yaml answer-key (release-format v2 §6);
# this task ships none. NOTE (accuracy, 2026-06-02 audit): the NIST WebBook sigma values are
# themselves generated by REFPROP via the Mulero (2012) surface-tension correlation, so that
# data-generating form is a §9.4 tautology and is EXCLUDED from the reference bank (see
# formulas/__init__.py). The shipped Eötvös/Kaptay baseline is a structurally distinct
# physical law that approximates the same data with genuine residual (pooled R²≈0.995, worst
# cluster methanol R²≈0.90), NOT a perfect inversion of the data-generating process.

context: >-
  The surface tension of a pure liquid decreases with increasing temperature
  and vanishes at the critical point, where the liquid and vapor phases
  become indistinguishable. The Eötvös rule (1886) relates surface tension
  to the molar volume of the liquid and the critical temperature: the product
  of surface tension and molar volume to the 2/3 power is proportional to
  the temperature deficit below the critical point. The proportionality
  constant (the Eötvös constant k) reflects each substance's intermolecular
  interactions; it is approximately universal for simple organic liquids
  (~2.2 × 10⁻⁷ J/(K·mol^(2/3))) but deviates for associated liquids such
  as water or alcohols where hydrogen bonding dominates. Molar volume is
  derived from the molar mass and liquid density, both of which vary with
  temperature along the saturation curve.

target:
  name: sigma
  symbol: σ
  unit: N/m
  description: Liquid surface tension along the saturation curve, computed from the NIST Chemistry WebBook SRD-69 (REFPROP) saturation tables. Restricted to T ≤ 0.85 * T_c per substance (Eötvös validity regime).
  range: [0.00061197, 0.07564400]

inputs:
  - name: T_K
    symbol: T
    unit: K
    description: Temperature in Kelvin along the saturation curve for the substance. Range restricted to [T_triple, 0.85 * T_c] per substance.
    range: [13.957, 559.640]
  - name: rho_liq
    symbol: rho_liq
    unit: kg/m³
    description: Liquid phase mass density along the saturation curve (from NIST WebBook). Used to compute molar volume V_m = M_mol / rho_liq in the Eötvös formula.
    range: [58.9250, 2966.2000]
  - name: T_c
    symbol: T_c
    unit: K
    description: Critical temperature of the substance in Kelvin. Constant within each cluster (per-substance covariate). Varies across substances.
    range: [33.15, 658.10]
  - name: M_mol
    symbol: M
    unit: kg/mol
    description: Molar mass of the substance in kg/mol. Constant within each cluster (per-substance covariate). Used to compute molar volume V_m = M_mol / rho_liq.
    range: [0.002016, 0.238028]

# Dataset — three-file v2 Type II layout, cluster (substance) holdout.
# 52 NIST pure fluids; every 4th by lex-sorted substance index -> test (13 substances).
# Within each test substance: T-interleaved split (even T-rank rows -> test_fit,
# odd T-rank rows -> test_test). Both halves span the full [T_triple, 0.85*T_c] range.
# Train substances contribute their full T-sweep to train.csv.
#
# v2 Type II schema rule (data_spec §4.1):
#   train.csv:     sigma, T_K, rho_liq, T_c, M_mol           (NO group_id)
#   test_fit.csv:  sigma, T_K, rho_liq, T_c, M_mol, group_id (group_id LAST)
#   test_test.csv: sigma, T_K, rho_liq, T_c, M_mol, group_id (group_id LAST)
#
# S2-P10 sister-task note: mirrors fluid_vapor_pressure_nist_webbook__log10_P_sat
# split rule (HOLDOUT_MOD=4, lex-sorted substance_id). 52 vs 53 fluids (5 missing
# sigma data) yields 13 vs 14 test clusters.
data_files:
  train:     data/train.csv
  test_fit:  data/test_fit.csv
  test_test: data/test_test.csv
n_train: 7407
n_test_fit: 1201
n_test_test: 1195
n_clusters_train: 39
n_clusters_test: 13
n_rows_per_cluster_min: 139
n_rows_per_cluster_median: 184
n_rows_per_cluster_max: 274

# Forward-compat per proposals/20260506_1015_rfs_unseen_group_strategy_patch.md §2.1.
# Value is "error" (default) because the holdout discipline guarantees
# set(test_fit.group_id) == set(test_test.group_id) with no unseen groups.
# The harness evaluate.py does not currently consume this field (RFS patch pending).
unseen_group_strategy: error

# Candidate prior constants — grounded in reference papers.
# The Eötvös constant k is approximately universal for simple organics (~2.22e-7);
# the critical scaling exponent 11/9 appears in the Van der Waals / Cahn theory
# near T_c (above 0.85*T_c, outside the Eötvös regime).
priors:
  - name: k_eotvos_universal
    value: 2.22e-7
    unit: J/(K·mol^(2/3))
    description: Approximate universal Eötvös constant for simple organic liquids — the mean value across many common non-associated liquids (Kaptay 2024 Table 1, PDF p. 5; range 1.02–2.38×10⁻⁷).
    source: Kaptay (2024) Table 1 (PDF p. 5) — corrected k values for ~12 fluids, mean ~2.22×10⁻⁷ J/(K·mol^(2/3)).
    _role: candidate
  - name: avogadro
    value: 6.02214076e23
    unit: mol⁻¹
    description: Avogadro number — appears in the mechanistic derivation of k = C_p,m / (6 * N_Av^(1/3)) (Kaptay 2024 Eq.(3d), PDF p. 7). Not directly used in the Eötvös formula itself.
    source: Kaptay (2024) Eq.(3d), PDF p. 7 — k = C_p,m / (6 * N_Av^(1/3)).
    _role: distractor
  - name: eotvos_exponent
    value: 0.6667
    unit: dimensionless
    description: The 2/3 exponent in V_m^(2/3) — derived from 3-D molecular packing geometry (Kaptay 2024 §6, Eq.(3b), PDF pp. 6-7). Structural constant of the Eötvös rule; appears in predict() as a literal 2/3.
    source: Kaptay (2024) §6 / Eq.(3b), PDF pp. 6-7 — three-dimensional molecular geometry argument.
    _role: candidate

# === Reference baselines ===
# F=1 after tautology audit: Mulero et al. (2012) REFPROP power-law removed because
# NIST REFPROP uses exactly the Mulero functional form to generate the sigma data
# (refitted per-cluster with 6 free params gives R2 = 1.000000, RMSE ~ 5e-7 N/m).
# Eötvös / Kaptay (2024) retained: pooled R2 ~ 0.997, genuine residuals for
# associated liquids confirm it is a real approximation baseline.
references:
  - id: kaptay_2024
    label: Kaptay 2024 — Eötvös rule sigma = k*(T_c-T)/V_m^(2/3)
    formula_file: formulas/kaptay_2024.py
    reference_pdf: reference/kaptay_2024.pdf
    n_law_constants: 0
    n_other_constants: 0
    n_local_params: 1
    measured: {rmse: 0.000282, r2: 0.9951}

# === v2 anti-dump caps (derived from evaluate.py reference) ===
caps:
  max_law_constants: 0
  max_local_params: 1
  max_init_size_per_param: 1
  fit_timeout_seconds: 10

# === Scoring ===
metric: rmse
best_baseline: 0.000282
