task_id: optical_dispersion_sellmeier__refractive_index
domain: physics / optics
license: CC0-1.0

# Type II — cluster = crystal specimen (material_id from Bond 1965).
# Each cluster = one crystal measured across 0.4–4.0 µm wavelength range.
# Primary baseline: Sellmeier 2-pole dispersion formula with per-cluster
# parameters B1, C1, B2, C2.
type: typeII
has_group_id: true

# FM-A1 audit note: n values are experimental refractive index measurements
# from W. L. Bond (1965), J. Appl. Phys. 36, 1674, using the minimum-deviation
# goniometer method on optically polished crystal prisms. Data hosted in the
# refractiveindex.info database as "tabulated n" records. NOT formula-computed
# values. FM-A1: PASS.

# FM-T-P-axis note: Within-cluster split uses ALTERNATING wavelength rank
# (even-idx -> test_fit, odd-idx -> test_test). Axis-aligned split (short-lam
# fit, long-lam test) was tested and shown to be degenerate for Sellmeier
# (R2 = -2.49 for Y3Al5O12 vs R2 = 0.78 with alternating). Interleaved split
# mandated per FM-T-P-axis. PASS.

context: >-
  Transparent crystals exhibit wavelength-dependent refractive index because
  the bound electrons in the crystal lattice respond differently to different
  frequencies of light. This normal dispersion arises from the interplay of
  electronic resonances in the ultraviolet and lattice phonon resonances in
  the infrared: regions closer to an absorption band show higher refractive
  index, creating the well-known decrease of refractive index with increasing
  wavelength across the visible spectrum. Different crystal compositions and
  structures give rise to very different absolute index values and dispersion
  strengths, with high-refractive-index semiconductors like gallium phosphide
  (n ~ 3.0–3.5) differing markedly from low-index phosphates like aluminium
  phosphate (n ~ 1.49–1.54). Both the UV electronic transitions and the IR
  phonon resonances contribute to the total dispersion at any given wavelength.

target:
  name: n
  symbol: "n"
  unit: dimensionless
  description: Real part of the refractive index at the specified vacuum wavelength, measured by the minimum-deviation goniometer method (Bond 1965) on single-crystal prisms at room temperature.
  range: [1.4928, 3.4595]

inputs:
  - name: wavelength_um
    symbol: "lambda"
    unit: um
    description: Vacuum wavelength of light in micrometers at which the refractive index was measured. Range covers near-UV through mid-infrared.
    range: [0.40, 4.00]

# Dataset — three-file v2 Type II layout, cluster holdout.
# Cluster = crystal specimen (material_id). 14 clusters total from Bond (1965).
# Cluster holdout: lexicographic sort of material_id; every 4th (indices 3, 7, 11)
# -> test. 11 train / 3 test clusters.
# Within-cluster split: alternating wavelength rank (even rows -> test_fit,
# odd rows -> test_test). Both windows span the full wavelength range per cluster.
# OOD probe: 3 test materials (CdSe_o, TiO2_e, ZnWO4_a) are entirely unseen
# during training; the per-cluster Sellmeier parameters must be recovered from
# the fit window only.
data_files:
  train:     data/train.csv
  test_fit:  data/test_fit.csv
  test_test: data/test_test.csv
n_train: 201
n_test_fit: 27
n_test_test: 26
n_clusters_train: 11
n_clusters_test: 3
n_rows_per_cluster_min: 14
n_rows_per_cluster_median: 18
n_rows_per_cluster_max: 24

unseen_group_strategy: error
# Type II forward-compat per proposals/20260506_1015_rfs_unseen_group_strategy_patch.md §2.1.
# Cluster-disjoint split makes this field unreachable at evaluation time;
# harness evaluate.py currently ignores it. Emitted for forward-compat.

# Reference-baseline bank
references:
  - id: sellmeier_1871
    label: Sellmeier (1871) 2-pole dispersion formula (B1, C1, B2, C2 per material)
    formula_file: formulas/sellmeier_1871.py
    reference_pdf: reference/polyanskiy_2024.pdf
    n_law_constants: 0
    n_other_constants: 0
    n_local_params: 4          # B1, C1, B2, C2
    measured:
      rmse: 0.006647797121279506
      r2: 0.999377994887617
  - id: cauchy_1836_eq55
    label: Cauchy (1836) 3-term formula Eq. 55 — n2 = A + B/lam^2 + C/lam^4
    formula_file: formulas/cauchy_1836_eq55.py
    reference_pdf: reference/cauchy_1836.pdf
    n_law_constants: 0
    n_other_constants: 0
    n_local_params: 3          # A, B, C
    measured:
      rmse: 0.010655533139735732
      r2: 0.9984019557224255
  - id: cauchy_1836_eq15
    label: Cauchy (1836) 4-term formula Eq. 15 — n2 = A + B/lam^2 + C/lam^4 + D/lam^6
    formula_file: formulas/cauchy_1836_eq15.py
    reference_pdf: reference/cauchy_1836.pdf
    n_law_constants: 0
    n_other_constants: 0
    n_local_params: 4          # A, B, C, D
    measured:
      rmse: 0.006824304227918350
      r2: 0.9993445264085151

# === v2 anti-dump caps ===
caps:
  max_law_constants:        0
  max_local_params:         4
  max_init_size_per_param:  1
  fit_timeout_seconds:      10

# S3-T7 cluster-distribution diagnostic (Stage 3 pre-computed)
# sellmeier_1871 per-cluster R2: [0.9994, 0.9885, 0.9891] — all positive, no failures.
# LOCAL_FITTABLE bounds-collapse observations:
#   cluster 3 (CdSe_o): B2 -> 0.0 (single-pole regime in 0.8-4 um range; IR pole negligible)
#   cluster 7 (TiO2_e): C2 -> 16.5 um^2 lower bound (data range 0.45-2.4 um; IR pole at boundary)
# Both are FM-T-ID1 identifiability observations, not fitting failures.
# Per S2-T7 HIGH-severity threshold (>20% clusters): 2/3 = 67% clusters hit a boundary.
# However R2 > 0.988 for both affected clusters — the formula still fits accurately.
# Root cause: 2-pole Sellmeier slightly over-parameterizes for materials with no IR data.
# The Cauchy baselines (which never have pole-boundary collapse) serve as structural comparison.
# This is documented as FM-T-ID1 (identifiability, not failure) per sellmeier_1871.py docstring.

# === Scoring ===
metric: rmse
best_baseline: 0.006647797121279506   # sellmeier_1871 pooled rmse — 0.5 score anchor
