task_id: bns_merger_disk_ejecta__Mej
metric: smape
domain: astronomy / gravitational-wave astrophysics
target:
  name: Mej
  symbol: M_ej
  unit: M_sun
  description: Dynamical ejecta mass expelled at merger, in solar masses.
  range:
  - "9e-06"
  - 0.019
inputs:
- name: M1
  symbol: M_1
  unit: M_sun
  description: Gravitational mass of the primary (heavier) neutron star.
  range:
  - 1.2
  - 1.86
- name: M2
  symbol: M_2
  unit: M_sun
  description: Gravitational mass of the secondary (lighter) neutron star.
  range:
  - 1.02
  - 1.71
- name: Mb1
  symbol: M^b_1
  unit: M_sun
  description: Baryonic (rest) mass of the primary neutron star.
  range:
  - 0.97
  - 2.13
- name: Mb2
  symbol: M^b_2
  unit: M_sun
  description: Baryonic (rest) mass of the secondary neutron star.
  range:
  - 0.88
  - 1.93
- name: C1
  symbol: C_1
  unit: ""
  description: Compactness of the primary neutron star, defined as G*M/(R*c^2); dimensionless.
  range:
  - 0.134
  - 0.231
- name: C2
  symbol: C_2
  unit: ""
  description: Compactness of the secondary neutron star, defined as G*M/(R*c^2); dimensionless.
  range:
  - 0.119
  - 0.205
- name: q
  symbol: q
  unit: ""
  description: Binary mass ratio (lighter over heavier component), dimensionless and in (0, 1].
  range:
  - 0.549
  - 1.0
- name: Lambda_tilde
  symbol: Λ̃
  unit: ""
  description: Effective binary tidal deformability combining the two component tidal deformabilities; dimensionless.
  range:
  - 116.0
  - 1689.0

# FM-H3 backfill (wave-11, 2026-05-26): empty priors block added for schema symmetry with GOLD.
priors: []

n_train: 50
n_test: 54
has_group_id: false
license: CC-BY-4.0
type: typeI

# Background knowledge — science framing only; no task instructions or constants.
context: >-
  When two neutron stars merge, a fraction of their matter is thrown off as dynamical ejecta, a phenomenon studied in relativistic astrophysics.

# Sister task of bns_merger_disk_ejecta__{Mdisk, vej}; each sister uses an
# independently-defensible OOD split (FM-E2). This task uses a cross-simulation-group
# split: train and test are disjoint NR author-groups. The full sister-divergence
# rationale and the 2026-05-29 Wave-16 revert are recorded in VERDICT.md.

# Dataset — Type I two-file layout
data_files:
  train: data/train.csv    # 51 rows, Radice 2018 + Lehner 2016 group (cross-simulation split)
  test:  data/test.csv     # 55 rows, Nedora 2020 / Vincent 2019 / Sekiguchi groups (OOD)

# === Reference baselines ===
references:
  - id: nedora_2020
    label: "Nedora et al. 2020 — log10 polynomial Eq. 6 (q, Lambda_tilde)"
    formula_file: formulas/nedora_2020.py
    reference_pdf: reference/nedora_2020.pdf
    n_law_constants: 6
    n_other_constants: 0
    n_local_params: 0
    measured:
      smape: 0.4668
      r2: 0.0873

  - id: coughlin_2018
    label: "Coughlin et al. 2018 — log10 symmetric fit Eq. E8 (M1, M2, C1, C2)"
    formula_file: formulas/coughlin_2018.py
    reference_pdf: reference/coughlin_2018.pdf
    n_law_constants: 4
    n_other_constants: 0
    n_local_params: 0
    measured:
      smape: 0.7056
      r2: -19.2101

  - id: dietrich_2017
    label: "Dietrich & Ujevic 2017 — baryonic-mass fit Eq. 1 (M1, M2, Mb1, Mb2, C1, C2)"
    formula_file: formulas/dietrich_2017.py
    reference_pdf: reference/dietrich_2017.pdf
    n_law_constants: 5
    n_other_constants: 0
    n_local_params: 0
    measured:
      smape: 0.8182
      r2: -8.0732

  - id: kruger_2020
    label: "Kruger & Foucart 2020 — gravitational-mass fit Eq. 6 (M1, M2, C1, C2)"
    formula_file: formulas/kruger_2020.py
    reference_pdf: reference/kruger_2020.pdf
    n_law_constants: 4
    n_other_constants: 0
    n_local_params: 0
    measured:
      smape: 0.9289
      r2: -6.9797

# Caps — from evaluate.py reference (derived_caps in reference_metrics.json)
caps:
  max_law_constants:        6
  max_local_params:         0
  max_init_size_per_param:  1
  fit_timeout_seconds:      null

# === Validity rubric ===
# Frozen list — the scoring-time judge (eval_consistency.py) scores a
# submission by how many of THESE criteria it satisfies:
# validity_score = (criteria satisfied) / len(validity_rubrics).
# De-leaked context + comprehensive multi-baseline extraction, 2026-06-01.
validity_rubrics:
  - "accounts for EOS-dependent stellar compactness or tidal deformability effects on ejecta production"
  - "accounts for enhanced tidal ejecta in unequal-mass binaries"
  - "predicted ejecta mass is non-negative"
  - "predicted ejecta mass does not exceed the total baryonic mass of the binary"
  - "predicted ejecta mass does not increase when either star’s compactness increases with other properties fixed"
  - "predicted ejecta mass does not decrease as the binary becomes more unequal in mass with other properties fixed"

best_baseline: 0.4668    # nedora_2020 — smape (lower is better); regenerated after within-fold de-dup (51/55→50/54)
