task_id: tree_biomass_allometry_chave__agb
domain: biology / forest_ecology
license: CC-BY-4.0

# Type I — each tree is an independent row; Chave's formula is a universal
# pantropical calibration with no per-site refit (data_spec §1.4).
type: typeI
has_group_id: false

# Background knowledge — science framing only (no column list, no constants,
# no functional form). Gold philosophy: describe the phenomenon and its
# physical drivers, not the formula the solver must discover.
context: >-
  Aboveground biomass is the total dry mass of a tree above the soil, a key quantity in forest ecology for estimating tropical carbon stocks.

target:
  name: agb_kg
  symbol: AGB
  unit: kg
  description: Oven-dry total aboveground biomass of an individual tropical tree, measured by destructive harvesting.
  range: [1.23, 76063.52]

inputs:
  - name: wood_density
    symbol: rho
    unit: g/cm^3
    description: Wood specific gravity — ratio of dry wood mass to fresh wood volume, a proxy for material density.
    range: [0.09, 1.2]
  - name: diameter_cm
    symbol: D
    unit: cm
    description: Trunk diameter at breast height (1.3 m above ground), the primary structural size predictor.
    range: [5.0, 212.0]
  - name: height_m
    symbol: H
    unit: m
    description: Total tree height from base to the highest living branch.
    range: [1.2, 70.7]

# Dataset — Type I two-file layout
data_files:
  train: data/train.csv  # trees with D <= 28.5 cm (75th-percentile OOD split)
  test:  data/test.csv   # trees with D > 28.5 cm (large-tree extrapolation)

n_train: 3003
n_test:  1001

# Train/test split: feature-axis OOD on trunk diameter D (cutoff 28.5 cm,
# the 75th percentile). Tests extrapolation of the pantropical power law
# from the common-D regime into the large-tree frontier where the calibration
# is sparser and per-unit AGB is highest.

# Note (auditor): agb_kg is an independent destructive-harvest measurement;
# it is NOT computed from the Chave formula. The formula fits imperfectly
# (sigma=0.357 on log scale), confirming the target is real measured data.

# FM C12 (priors-leakage) fix — 2026-05-26
# Per AUDIT_CHECKLIST.md §C12 (v0.6) and audit/PRIORS_LEAKAGE_AUDIT_2026-05-26.md.
#
# Pre-fix: LEAKAGE — three leaking priors:
#   chave_eq4_exponent=0.976 ↔ chave_2014.py LAW_CONSTANTS["alpha"]=0.976
#   chave_eq4_coeff=0.0673 ↔ chave_2014.py LAW_CONSTANTS["c"]=0.0673
#   chave_eq5_coeff=0.0559 ↔ chave_2014_eq5.py LAW_CONSTANTS["c"]=0.0559
#   (Note: chave_eq5_coeff was _role: distractor but still leaks the LAW value.)
#
# Classification: ALL THREE are purely empirical regression coefficients from
# Chave 2014 total-least-squares fits to a ~4000-tree pantropical dataset.
# The exponent (0.976) and coefficients (0.0673, 0.0559) are fit results specific
# to the Chave 2014 calibration — not derivable from first principles or universal
# physical theory. No upstream physical anchor.
# Strategy B: REMOVE all three leaking entries.
#
# Replacement distractors from metabolic theory / geometric scaling / related
# allometry literature — none matching any LAW/OTHER constant in any formula file:
#
#   WBE_exponent=0.75: West-Brown-Enquist (1997, 1999) metabolic scaling exponent
#     B ∝ M^(3/4), derived from fractal vascular network theory. Applies to metabolic
#     rate, not to AGB; different allometric relationship from Chave's structural
#     power-law on (rho*D^2*H). Does not appear in chave_2014.py or chave_2014_eq5.py.
#
#   geometric_taper_exp=2.0: Geometric trunk-taper scaling exponent — cylindrical
#     log theory predicts volume ∝ D^2 * H (exponent = 1.0 for linear in D^2*H
#     product). The exponent 2 on D in the wood volume estimate rho*D^2*H is structural
#     geometry, not a calibration constant, but the value 2.0 as a stand-alone
#     potential exponent for AGB ∝ D^2 is a domain-relevant candidate to consider.
#     Does not match any LAW/OTHER constant.
#
#   wood_density_global_mean=0.58: Global mean tropical tree wood density (g/cm^3)
#     from the Chave 2009 global wood-density database (Zanne 2009). A
#     domain reference value, not a formula coefficient.
#
# Post-fix: CLEAN — no prior matches any LAW_CONSTANTS value in chave_2014.py or
# chave_2014_eq5.py. (Leak test is against LAW_CONSTANTS only, per AUDIT_CHECKLIST
# §C12 corrected 2026-05-29; a prior↔OTHER_CONSTANTS overlap is not a leak. Moot
# here regardless — both formulas have OTHER_CONSTANTS={}.)

priors:
  - name: WBE_metabolic_exponent
    value: 0.75
    unit: dimensionless
    description: West-Brown-Enquist (1997, 1999) metabolic scaling exponent — metabolic rate B ∝ M^(3/4), derived from fractal vascular network theory. This applies to metabolic scaling, NOT to the structural AGB allometry (AGB ∝ rho*D^2*H) in this task; the Chave 2014 formula has a DIFFERENT target variable and different input structure.
    source: "West GB, Brown JH, Enquist BJ (1997) Science 276:122-126; West GB et al. (1999) Science 284:1677-1679."
    _role: distractor
  - name: Jenkins_hardwood_exponent
    value: 2.4800
    unit: dimensionless
    description: Power-law exponent for hardwood component biomass from Jenkins et al. (2003) US national biomass equation for hardwoods — AGB components ∝ D^exponent. Different species group, different country calibration, and different formula structure from Chave 2014's pantropical three-predictor model.
    source: "Jenkins JC et al. (2003) Ecological Monographs 73:443-463, Table 4 (hardwood, total aboveground biomass)."
    _role: distractor
  - name: wood_density_tropical_mean
    value: 0.57
    unit: g/cm^3
    description: Global mean tropical angiosperm wood density from the Zanne et al. (2009) global wood-density database, used in pan-tropical biomass studies as a reference value. Not a coefficient in any allometric formula shipped here.
    source: "Zanne AE et al. (2009) Global wood density database (Dryad). Reported in Chave J et al. (2009) Ecol. Lett. 12:351-366, Table 1."
    _role: distractor

# Reference-baseline bank
references:
  - id: chave_2014
    label: Chave et al. 2014 — pantropical AGB Eq. (4), power-law fit on rho*D^2*H
    formula_file: formulas/chave_2014.py
    reference_pdf: reference/chave_2014.pdf
    n_law_constants:   2   # c = 0.0673, alpha = 0.976
    n_other_constants: 0
    n_local_params:    0
    measured:
      rmse: 2410.8807
      r2: 0.8808
  - id: chave_2014_eq5
    label: Chave et al. 2014 — constrained Eq. (5), linear in rho*D^2*H (alpha=1)
    formula_file: formulas/chave_2014_eq5.py
    reference_pdf: reference/chave_2014.pdf
    n_law_constants:   1   # c = 0.0559
    n_other_constants: 0
    n_local_params:    0
    measured:
      rmse: 2376.6452
      r2: 0.8841

caps:
  max_law_constants:        2
  max_local_params:         0
  max_init_size_per_param:  1
  fit_timeout_seconds:      null

metric: log_mae    # agb_kg spans ~4.8 decades (1.2 .. 7.6e4); allometry is
# === Validity rubric ===
# Frozen list — the scoring-time judge (eval_consistency.py) scores a
# submission by how many of THESE criteria it satisfies:
# validity_score = (criteria satisfied) / len(validity_rubrics).
# De-leaked context + comprehensive multi-baseline extraction, 2026-06-01.
validity_rubrics:
  - "include tree-height dependence reflecting increasing aboveground volume"
  - "include trunk-diameter dependence reflecting increasing stem cross-sectional area"
  - "include wood-density dependence as a proxy for material density"
  - "predicted AGB is non-negative"
  - "predicted AGB approaches zero as diameter_cm or height_m approaches zero"

best_baseline: 0.109234    # chave_2014 — log_mae (lower is better); regenerated 2026-06-01
