task_id: materials_project_elastic_birch_murnaghan__K_VRH
domain: materials_science / solid-state_mechanics
license: CC-BY-4.0

# Type I — each compound is an independent observation; no cluster structure.
# crystal_system_id is a categorical input feature, not a group_id.
type: typeI
has_group_id: false

context: >-
  Inorganic crystalline compounds resist uniform compression according to their
  bulk modulus, which reflects the strength of chemical bonds and the packing
  geometry of the crystal. The Voigt-Reuss-Hill (VRH) average bulk modulus
  K_VRH is the standard polycrystalline estimate, computed as the arithmetic
  mean of the Voigt upper bound and Reuss lower bound derived from the full
  single-crystal elastic tensor. Empirically, K_VRH correlates inversely with
  atomic volume: more tightly packed structures are stiffer. Crystal symmetry
  (captured by the crystal system class) modulates this trend, and average
  atomic mass and mass density provide additional structural information. Values
  range from a few GPa for soft ionic compounds to several hundred GPa for
  covalent solids such as diamond.

target:
  name: K_VRH_GPa
  symbol: "K_VRH"
  unit: GPa
  description: Voigt-Reuss-Hill average polycrystalline bulk modulus, computed from the DFT-PBE elastic tensor via K_VRH = (K_Voigt + K_Reuss) / 2.
  range: [6.476, 401.329]

inputs:
  - name: V_atomic_A3
    symbol: "V_a"
    unit: "angstrom^3"
    dtype: float
    description: Atomic volume — unit-cell volume divided by the number of atomic sites.
    range: [6.994, 63.737]
  - name: M_avg_amu
    symbol: "M_avg"
    unit: amu
    dtype: float
    description: Average atomic mass per site, computed from the chemical composition.
    range: [3.974, 208.980]
  - name: density_g_cm3
    symbol: "rho"
    unit: "g/cm^3"
    dtype: float
    description: Mass density derived from atomic mass and unit-cell volume.
    range: [0.568, 21.993]
  - name: crystal_system_id
    symbol: "cs"
    unit: ""
    dtype: float
    description: "Crystal system encoded as integer: 2=monoclinic, 3=orthorhombic, 4=tetragonal, 5=trigonal, 6=hexagonal, 7=cubic."
    range: [2, 7]

data_files:
  train: data/train.csv
  test: data/test.csv
n_train: 827
n_test: 177

# === 2026-05-29 audit notes ===
# (1) NAME: "birch_murnaghan" in the task_id is a legacy misnomer -- NO baseline is a
#     Birch-Murnaghan equation of state. The shipped baselines are empirical bulk-modulus
#     vs atomic-volume scaling laws (Anderson-Nafe 1965, Cohen 1985). The Murnaghan/BM
#     references and the 7/3 & K0'=4 priors are background context only (distractors).
#     A clean rename (e.g. ...bulk_modulus_volume_scaling__K_VRH) is recommended but the
#     task_id is coordinator-managed; flagged in audit/inbox.
# (2) INPUT REDUNDANCY: density_g_cm3 = 1.66054 * M_avg_amu / V_atomic_A3 exactly
#     (1 amu/A^3 = 1.66054 g/cm^3) -- an exact algebraic function of two other inputs.
#     After the linear_ols removal NO remaining baseline uses M_avg or density
#     (anderson_nafe uses V + crystal_system; cohen uses V); retained as SR descriptors.
# (3) The hf_new_source dejong_2015 "K_VRH = (K_Voigt + K_Reuss)/2" formula was correctly
#     NOT adopted -- it is the VRH definitional identity (a tautology).

priors:
  - name: cohen_bulk_exponent
    value: -1.1667
    unit: dimensionless
    description: Volume exponent in Cohen's (1985) bulk modulus scaling law for covalent solids. K scales as V_atomic^(-3.5/3) because bond length d is proportional to V_atomic^(1/3) and Cohen's formula gives K proportional to d^(-3.5).
    source: Cohen, Phys. Rev. B 32:7988 (1985); documented in reference/summary_birch_murnaghan_kvrh.md §3.
    _role: candidate
  - name: anderson_nafe_exponent
    value: -1.3333
    unit: dimensionless
    description: Slope in the Anderson-Nafe log-linear relation log10(K) = a - (4/3)*log10(V_atomic) for oxide isoelectronic families.
    source: Anderson & Nafe, J. Geophys. Res. 70:3951 (1965); documented in reference/summary_birch_murnaghan_kvrh.md §4.
    _role: candidate
  - name: birch_murnaghan_exponent_73
    value: 2.3333
    unit: dimensionless
    description: 7/3 exponent in the Birch-Murnaghan third-order finite-strain equation of state P(V). Appears in the leading term (V0/V)^(7/3).
    source: Birch, Phys. Rev. 71:809 (1947). Supporting context for the task name; not used by any baseline here.
    _role: distractor
  - name: murnaghan_k0prime_typical
    value: 4.0
    unit: dimensionless
    description: Typical value of K0-prime (pressure derivative of bulk modulus at zero pressure) for many ionic and covalent solids, used in the Murnaghan and Birch-Murnaghan equations of state.
    source: Murnaghan 1944, PNAS 30:244; Birch 1947. Not a coefficient in any baseline here.
    _role: distractor

references:
  - id: cohen_1985
    label: "Cohen 1985 — paper-frozen K = 1972 / d^3.5, d = V_atomic^(1/3)"
    formula_file: formulas/cohen_1985.py
    reference_pdf: null
    n_law_constants: 2
    n_other_constants: 0
    n_local_params: 0
    measured:
      rmse: 84.6968
      r2: -0.3433
  - id: anderson_nafe_1965
    label: "Anderson-Nafe 1965 — log-linear log10(K) = a - (4/3)*log10(V), a fit per crystal system"
    formula_file: formulas/anderson_nafe_1965.py
    reference_pdf: null
    n_law_constants: 1
    n_other_constants: 8
    n_local_params: 0
    measured:
      rmse: 59.6039
      r2: 0.3347
  # linear_ols REMOVED by the 2026-05-29 audit: it was a train-fitted multivariate
  # OLS (K = b0+b1*V+b2*M+b3*rho) with NO published-law provenance (its own docstring:
  # "NOT derived from any published physical theory ... no literature equation"), yet it
  # was the best baseline and thus the scoring anchor (A3 — anchoring the benchmark on a
  # data-fit regression, not a law). Removed so the anchor falls to a genuine published
  # closed-form law (anderson_nafe_1965). Archived under .before_audit_2026-05-29/.
  # The two retained baselines are real published closed-form laws (Anderson-Nafe 1965,
  # Cohen 1985); cohen R2=-0.34 is a faithful out-of-domain rung (Cohen's law targets
  # diamond/zincblende, not MP's broad oxide set) kept per the negative-R2 (E6/§9.14) rule.

caps:
  max_law_constants: 2
  max_local_params: 0
  max_init_size_per_param: 1
  fit_timeout_seconds: null
metric: rmse
best_baseline: 59.6039    # anderson_nafe_1965 RMSE (genuine published law); was 37.5391 (linear_ols, removed 2026-05-29)
