task_id: her_hor_pt_acid_kucernak__current_density
domain: chemistry / electrochemistry
license: CC0-1.0

# Type I — single global formula. Kucernak & Zalitis (2016) fit ALL 13 polarisation
# curves SIMULTANEOUSLY with one shared set of parameters (PDF p. 27, Sec. 4.1).
# The kinetic constants are cross-condition INVARIANTS = the discovery target (LAW);
# the condition-dependence (T, P_H2, c_acid) is captured explicitly by the form
# (Arrhenius Eq 71, Henry's law Eq 69, proton activity a_H+). No per-cluster fit.
# Audit 2026-06-02: rebuilt from a mis-built Type II (which buried the 5 invariant
# constants as per-cluster LOCAL — a Direction-A field error — and made Ea
# unidentifiable per single condition since T is constant within a condition).
# See VERDICT.md.
type: typeI
has_group_id: false   # Type I — no clusters, no group_id column

# Background knowledge — science framing only; no column listing, no formula.
context: >-
  The hydrogen oxidation reaction (HOR) and hydrogen evolution reaction (HER)
  are mirror electrochemical half-reactions: H2 ⇌ 2H⁺ + 2e⁻. On platinum
  catalysts in acid electrolyte, the kinetics follow a two-step
  Heyrovsky-Volmer mechanism in which H2 is electrochemically dissociated
  (Heyrovsky step) and adsorbed hydrogen is oxidised (Volmer step). The
  steady-state current density is a function of the overpotential — the
  deviation of the electrode potential from the thermodynamic equilibrium
  value (E_eq = 0 V vs the reversible hydrogen electrode). At higher
  temperatures and higher H2 partial pressures, the reaction is faster.
  The exchange current density — the rate at which the equilibrium reaction
  proceeds simultaneously in both directions — is a sensitive probe of
  catalyst activity. Near the equilibrium potential (low overpotential), the
  current-overpotential relationship is governed by the elementary rate
  constants of the Heyrovsky and Volmer steps; a single set of intrinsic
  kinetic constants, together with the temperature, H2 partial pressure and
  acid concentration, describes the family of polarisation curves.

target:
  name: current_density
  symbol: j
  unit: "A cm-2"
  description: Specific current density per real platinum surface area (from upd-H charge), measured by potentiostat chronoamperometry on a floating electrode. Positive = anodic (HOR direction). Negative = cathodic (HER direction).
  range: [-486.0, 388.0]

inputs:
  - name: eta
    symbol: "η"
    unit: V
    description: >-
      Overpotential (V vs reversible hydrogen electrode, RHE). Since the
      measurement is performed vs RHE and the equilibrium potential is
      E_eq = 0 V vs RHE, the overpotential equals the measured potential
      directly: eta = E_vs_RHE. Positive = anodic (HOR favoured).
    range: [-0.05, 0.05]
  - name: T
    symbol: T
    unit: K
    description: Temperature of the water-jacketed electrochemical cell. The T series spans 278–333 K in 4.0 M HClO4.
    range: [278.0, 333.0]
  - name: P_H2
    symbol: "P(H2)"
    unit: bar
    description: H2 partial pressure, corrected for water vapour pressure at elevated temperatures. The p(H2) series spans 0.029–0.126 bar at T=298 K in 0.5 M HClO4; the T series is at p(H2)~0.8–0.99 bar.
    range: [0.029, 0.99]
  - name: c_acid
    symbol: "c(HClO4)"
    unit: "mol dm-3"
    description: HClO4 concentration. Either 0.5 M (p(H2) series) or 4.0 M (T series).
    values: [0.5, 4.0]

# Dataset — Type I two-file layout. Representative pooled split (the paper holds
# nothing out — it fits all 13 conditions simultaneously): within EACH condition
# the rows are sorted by |eta| and split by rank % 3 (~2:1 train:test), so train
# and test BOTH span all 13 conditions and the full overpotential range. No
# group_id. Kinetic-region filter |eta| <= 0.050 V (paper Sec. 4.2, PDF p. 28).
data_files:
  train: data/train.csv
  test:  data/test.csv
n_train: 676
n_test: 334

# Candidate prior constants — the OTHER given constants (CODATA / structural) the
# formula consumes, plus distractors. Audit 2026-06-02: a priors block was added
# (was missing, H3). LAW ∩ priors = ∅ (the intrinsic kinetic constants are never
# exposed); OTHER ⊆ priors.
priors:
  - name: faraday_constant
    value: 96485.0
    unit: C mol-1
    description: Faraday constant F — charge per mole of electrons; sets f = F/(R*T) and the current prefactor.
    source: NIST CODATA 2018; Kucernak & Zalitis (2016) PDF p. 28.
    _role: candidate
  - name: gas_constant
    value: 8.314
    unit: J mol-1 K-1
    description: Molar gas constant R — appears in the thermal voltage f = F/(R*T) and the Arrhenius factor exp(-Ea/R*(1/T-1/T_ref)).
    source: NIST CODATA 2018; Kucernak & Zalitis (2016) PDF p. 28.
    _role: candidate
  - name: ref_temperature
    value: 298.15
    unit: K
    description: Reference temperature T_ref in the Arrhenius temperature scaling (Eq 71); 25 °C standard.
    source: Kucernak & Zalitis (2016) Eq 71, PDF p. 27.
    _role: candidate
  - name: elementary_charge
    value: 1.602176634e-19
    unit: C
    description: Elementary charge e — a fundamental constant (F = N_A·e) but not used directly by the rate expression.
    source: NIST CODATA 2018.
    _role: distractor
  - name: avogadro_constant
    value: 6.02214076e23
    unit: mol-1
    description: Avogadro constant N_A — fundamental constant (F = N_A·e) but not used directly by the rate expression.
    source: NIST CODATA 2018.
    _role: distractor

# === Reference baselines ===
# Two formulas from Kucernak & Zalitis (2016): the full Heyrovsky-Volmer (HV)
# kinetic model (Eq 19) and the simpler Butler-Volmer (BV) limiting case
# (Eqs 20-21). Both Type I: LAW = the intrinsic constants (globally fit to train),
# predict-only, no fit().
references:
  - id: kucernak_2016_hv
    label: "Kucernak & Zalitis 2016 — Heyrovsky-Volmer kinetic model (Eq. 19)"
    formula_file: formulas/kucernak_2016_hv.py
    reference_pdf: reference/kucernak_2016.pdf
    n_law_constants: 5         # k2_eq_ref, K_std, G_std, beta, Ea
    n_other_constants: 3       # F, R, T_ref (CODATA + structural pivot)
    n_local_params: 0          # Type I
    measured: {rmse: 14.362733505830931, r2: 0.9920998171985668}
  - id: kucernak_2016_bv
    label: "Kucernak & Zalitis 2016 — Butler-Volmer limiting case (Eqs 20-21)"
    formula_file: formulas/kucernak_2016_bv.py
    reference_pdf: reference/kucernak_2016.pdf
    n_law_constants: 3         # i0_ref, beta, Ea
    n_other_constants: 3       # F, R, T_ref
    n_local_params: 0          # Type I
    measured: {rmse: 66.89842532954748, r2: 0.8286063504751774}

best_baseline: 14.362733505830931    # kucernak_2016_hv rmse — the 0.5 score anchor

# === v2 anti-dump caps ===
caps:
  max_law_constants:        5
  max_local_params:         0
  max_init_size_per_param:  1
  fit_timeout_seconds:      null   # Type I has no fit()

# === Scoring ===
metric: rmse

# === Auditor notes ===
auditor_notes: >-
  Rebuilt Type II -> Type I (2026-06-02 audit). The paper fits all 13 polarisation
  curves simultaneously with one shared 5-parameter set (PDF p. 27, Sec. 4.1; Table 4;
  Fig. 8 "common set of parameters"), so the intrinsic kinetic constants are
  cross-condition invariants and belong in LAW_CONSTANTS, not as per-cluster LOCAL.
  The prior Type II buried them as LOCAL (Direction-A) and additionally placed the
  CODATA F/R in LAW (Direction-B); both fixed. A global least-squares fit on train
  recovers shape constants (beta=0.35, Ea=17.8 kJ/mol, K_std=3.30) matching the
  paper's Table 4 (1/3, 18 kJ/mol, 3.09); the released floating-electrode currents
  sit ~10^3x above the paper's example parameter scale (the paper's k2_eq~5.1e-6 does
  not reproduce this data), so k2_eq_ref/i0_ref are fit to the released data. HV
  (best) test R2=0.992 (rmse 14.4); BV the deliberately-inadequate limiting case
  (single i0, no explicit P_H2 dependence) test R2=0.829 (rmse 66.9) — both beat the
  naive constant predictor (test rmse 161.8). G_std~0.29 puts the data in the small-G
  regime where k2_eq_ref and G_std are partially degenerate (only their product sets
  the scale); HV's advantage over BV comes from the K_std denominator term (K_std=3.30
  != 1), exactly the paper's point that the Butler-Volmer reduction does not hold on Pt.
