task_id: streamchannel_at_station_hydraulic_geometry_ifmha__chan_width
domain: earth_science / fluvial_geomorphology
license: MIT

# Type II — cluster = USGS gauging station (site_no).
# Each station has its own at-a-station hydraulic geometry curve:
# the width coefficient a and width exponent b in w = a*Q^b vary by station
# as a function of channel shape, sediment, vegetation, and valley setting.
type: typeII
has_group_id: true

# Background knowledge — the `context` prompt slot. Science framing only:
# no task instructions, no column listing, no priors.
context: >-
  When a river rises in flood, its channel widens, deepens, and flows faster.
  The relationship between discharge and channel dimensions at a fixed gauging
  cross-section has been studied since the 1950s and is one of the most
  replicated empirical findings in fluvial geomorphology. At any individual
  gauging station, water-surface width tends to scale as a simple power function
  of discharge: narrow channels widen gradually as more water flows through them,
  while wide sandy channels may expand considerably with modest increases in
  flow. The steepness of this width-discharge relationship varies from river to
  river depending on channel geometry, bank materials, and bed configuration.
  Engineers and hydrologists use these relationships to predict channel behaviour
  during floods, design culverts and bridges, and estimate hydraulic conditions
  from satellite imagery. The data come from decades of field surveys at USGS
  stream-gauging stations, where trained hydrographers measure discharge by
  integrating velocity profiles across a cross-section and simultaneously record
  the wetted width and depth at the measurement time.

target:
  name: chan_width
  symbol: "w"
  unit: "ft"
  description: Water-surface width at the gauging cross-section measured during a field current-meter discharge measurement (USGS NWIS).
  range: [0.50, 4710.0]

inputs:
  - name: chan_discharge
    symbol: "Q"
    unit: "cfs"
    description: Stream discharge (cubic feet per second) measured by velocity-area method at the gauging cross-section.
    range: [0.010, 112000.0]

# Dataset — three-file v2 Type II layout.
# Cluster holdout: 10 train stations / 10 test stations (50 % / 50 %).
# Within-cluster split: INTERLEAVED on Q-rank (odd index -> test_fit,
# even index -> test_test), ensuring both halves span the full discharge range.
data_files:
  train:     data/train.csv
  test_fit:  data/test_fit.csv
  test_test: data/test_test.csv
n_train: 1806
n_test_fit: 941
n_test_test: 945
n_clusters_train: 10
n_clusters_test: 10

# group_id mapping (test stations only, lexicographic by site_no):
#   0=01325000 (NY Hudson trib)    6=07230000 (OK Red R. trib)
#   1=02171001 (SC Wateree R.)     7=08050840 (TX Trinity R.)
#   2=02227270 (GA Oconee trib)    8=08121000 (TX Colorado R.)
#   3=06395000 (SD Cheyenne R.)    9=13057300 (ID Portneuf trib)
#   4=06803300 (NE Platte trib)
#   5=07142020 (KS Arkansas trib)

# Train stations (no group_id in train.csv):
#   01514801 (NY), 03372500 (IN), 05593000 (IL), 07075270 (AR),
#   09083800 (CO), 11406890 (CA), 12391950 (ID), 12401500 (WA),
#   12419000 (ID), 13011000 (MT)

# Reference baselines
references:
  - id: leopold_1953
    label: "Leopold & Maddock (1953) — at-a-station power law w = a*Q^b, 2 LOCAL params (a, b)"
    formula_file: formulas/leopold_1953.py
    reference_pdf: reference/leopold_1953.pdf
    n_law_constants: 0
    n_other_constants: 0
    n_local_params: 2
    measured:
      rmse: 21.442
      r2: 0.9859
  # Audit 2026-06-02 (claude-opus-4-8): this entry was previously "park_1977", a
  # phantom (un-registered) baseline whose log-quadratic form was MIS-ATTRIBUTED to
  # Park (1977) — Park critiqued power functions but did not propose the quadratic — and
  # carried a grafted Schuster & Dubovik (2006) aerosol reference. Re-attributed to the
  # true source Richards (1973), registered, and metrics regenerated by the harness
  # (the old hand-written 73.611 happened to match the real value). See VERDICT.md and
  # reference/summary_formula_richards_1973.md.
  - id: richards_1973
    label: "Richards (1973) — log-quadratic (non-linear) form log(w)=p0+p1*log(Q)+p2*(log Q)^2, 3 LOCAL params (p0,p1,p2); nests leopold_1953 (p2=0)"
    formula_file: formulas/richards_1973.py
    reference_pdf: null    # Am. J. Sci. (1973) paywalled; form verified via open secondary sources (Singh 2003 IJSR + Said 2005), see reference/summary_formula_richards_1973.md + reference/singh_2003_hydraulic_geometry_theories.pdf
    n_law_constants: 0
    n_other_constants: 0
    n_local_params: 3
    measured:
      rmse: 73.6112
      r2: 0.8336

caps:
  max_law_constants: 0
  max_local_params: 3    # richards_1973 has 3 LOCAL params (p0,p1,p2); = derived_caps
  max_init_size_per_param: 1
  fit_timeout_seconds: 10

metric: rmse
best_baseline: 21.442
best_baseline_id: leopold_1953

# FM-T-ID1 note: Q range >= 10x enforced for all 20 selected stations (range 22x
# to >10,000x), so the width exponent b is well-identifiable in all clusters.
# FM-T-P-axis: within-cluster split uses INTERLEAVED on Q-rank, not low-Q-only fit.
# invariant_constants: none (w = a*Q^b has no fixed universal numerical constants;
#   both a and b are per-station fit parameters; the structural form is the claim).
