task_id: cloud_cover_parameterization__cloud_cover
domain: earth_science / atmospheric_science
license: CC-BY-4.0

type: typeI
has_group_id: false

context: >-
  This task concerns the fraction of an atmospheric model grid cell occupied by clouds, a quantity that must be parameterized in climate modeling.

target:
  name: cloud_cover
  symbol: C
  unit: ""
  description: Sub-grid cloud area fraction in a coarse-grained atmospheric volume, dimensionless in [0, 1].
  range: [0.0, 1.0]

inputs:
  - name: q_c
    symbol: q_c
    unit: kg/kg
    description: Cloud liquid water mixing ratio — mass of cloud liquid water per unit mass of moist air.
    range: [0.0, 0.00048]
  - name: q_i
    symbol: q_i
    unit: kg/kg
    description: Cloud ice mixing ratio — mass of cloud ice per unit mass of moist air.
    range: [0.0, 0.00014]
  - name: RH
    symbol: RH
    unit: ""
    description: Relative humidity with respect to liquid water, computed from specific humidity, temperature, and pressure.
    range: [0.0003, 1.02]
  - name: T
    symbol: T
    unit: K
    description: Air temperature at the model level.
    range: [191.0, 313.0]
  - name: p
    symbol: p
    unit: Pa
    description: Atmospheric pressure at the model level.
    range: [1525.0, 101611.0]
  - name: q_v
    symbol: q_v
    unit: kg/kg
    description: Specific humidity — mass of water vapour per unit mass of moist air.
    range: [0.000002, 0.0198]
  - name: z_g
    symbol: z_g
    unit: m
    description: Geometric height of the model level above the surface.
    range: [20.0, 28194.0]
  - name: dz_RH
    symbol: dRH/dz
    unit: 1/m
    description: Vertical derivative of relative humidity along the geometric height coordinate, computed by cubic spline interpolation.
    range: [-0.00283, 0.00065]

# FM-H3 backfill (wave-11, 2026-05-26): empty priors block added for schema symmetry with GOLD.
priors: []

data_files:
  train: data/train.csv  # random 80% of the NARVAL-II R2B4 snapshot (seed=42)
  test:  data/test.csv   # random 20% of the NARVAL-II R2B4 snapshot (seed=42)

n_train: 32088
n_test:  8022

# Train/test split: random i.i.d. 80/20 (seed 42), per the Grundner 2022
# protocol on equivalent NARVAL data (random 78/8/20). The three reference
# baselines are frozen literature formulas calibrated on a DIFFERENT dataset
# (DYAMOND offline / AMIP online), so this is a calibration-transfer bench:
# 2 of 3 baselines have negative pooled R2 on NARVAL; the mixed bank ships
# because grundner_2025 beats naive (R2=0.49). Full reasoning in VERDICT.md.

references:
  - id: grundner_2024
    label: Grundner 2024 — PySR cloud cover parameterization, DYAMOND offline fit (Eq. 10+6+11)
    formula_file: formulas/grundner_2024.py
    reference_pdf: reference/grundner_2024.pdf
    n_law_constants:   10   # a1..a9, epsilon
    n_other_constants:  2   # RH_bar, T_bar
    n_local_params:     0
    measured:
      rmse: 0.1480
      r2: -0.2215
  - id: grundner_2025
    label: Grundner 2025 — same structural form, ICON-A-MLe online-tuned coefficients (Eq. 3)
    formula_file: formulas/grundner_2025.py
    reference_pdf: reference/grundner_2025.pdf
    n_law_constants:   10   # a1..a9, epsilon
    n_other_constants:  2   # RH_bar, T_bar
    n_local_params:     0
    measured:
      rmse: 0.0956
      r2: 0.4902
  - id: xu_randall_1996
    label: Xu-Randall 1996 — classical semi-empirical scheme, DYAMOND-fit alpha/beta (Eq. 4 in Grundner 2024)
    formula_file: formulas/xu_randall_1996.py
    reference_pdf: reference/xu_randall_1996.pdf
    n_law_constants:   2    # alpha, beta
    n_other_constants: 0
    n_local_params:    0
    measured:
      rmse: 0.2470
      r2: -2.4022

caps:
  max_law_constants:        10
  max_local_params:         0
  max_init_size_per_param:  1
  fit_timeout_seconds:      null

metric: rmse
# === Validity rubric ===
# Frozen list — the scoring-time judge (eval_consistency.py) scores a
# submission by how many of THESE criteria it satisfies:
# validity_score = (criteria satisfied) / len(validity_rubrics).
# De-leaked context + comprehensive multi-baseline extraction, 2026-06-01.
validity_rubrics:
  - "include nonlinear relative-humidity control of cloud cover"
  - "predicted cloud_cover stays within [0, 1]"
  - "predicted cloud_cover is zero when q_c + q_i is zero"

best_baseline: 0.0956211    # grundner_2025 — rmse (lower is better); regenerated 2026-05-30
