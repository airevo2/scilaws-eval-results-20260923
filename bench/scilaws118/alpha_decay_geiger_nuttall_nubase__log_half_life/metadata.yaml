#       in CrossRef/OpenAlex/Semantic Scholar/INSPIRE/Unpaywall; PDF missing;
#       constants only secondary-cited. Anti-fabrication: not locatable in a source.
#   The metadata's best_baseline (0.9366) and caps.max_law_constants (9) were
